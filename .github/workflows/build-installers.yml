name: Build NLP Suite Installers

# Trigger: manually from the Actions tab, or on tagged releases
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job below asks for write access.
permissions:
  contents: read

jobs:
  build:
    # A normal build takes about 20 minutes; this stops a hung download or pip install from holding
    # the runner for GitHub's default 6 hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NLP-Suite-windows-x64
            python-version: '3.10'
          - os: macos-15          # Apple Silicon (M1+); macos-14 was retired by GitHub on 2 Nov 2026
            artifact: NLP-Suite-mac-arm64
            python-version: '3.10'

    runs-on: ${{ matrix.os }}

    steps:
      # NO `ref:` here on purpose: checkout then defaults to the ref that TRIGGERED the run -- i.e. the
      # v* tag being released. This used to pin `ref: roberto`, so a tag only *triggered* the build while
      # the installers were built from roberto's tip: the tag did not describe what users downloaded, and
      # anything sitting on roberto shipped to external users on the next tag, with no promotion step.
      # The release job below already checks out the tag, so the two now agree.
      - name: Checkout code
        uses: actions/checkout@v4

      # A v* tag MUST ship a matching lib/release_version.txt. The app's exit-time check compares the
      # INSTALLED file against the copy on current-stable, so when the two drift the check silently lies:
      # that is exactly how the file sat at 5.3.4 for seven weeks while v1.6.19..v1.6.22 shipped, telling
      # every user they were up to date. Bumping it is manual, so guard it here -- this costs seconds and
      # fails BEFORE the ~20-minute PyInstaller build, rather than publishing installers that misreport
      # their own version. `shell: bash` because the Windows runner defaults to pwsh.
      - name: Verify release_version.txt matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d ' \t\r\n' < lib/release_version.txt)"
          echo "tag=${GITHUB_REF_NAME} -> expected '${TAG_VERSION}' | lib/release_version.txt='${FILE_VERSION}'"
          if [ "${TAG_VERSION}" != "${FILE_VERSION}" ]; then
            echo "::error::lib/release_version.txt says '${FILE_VERSION}' but the tag is '${GITHUB_REF_NAME}'. Set lib/release_version.txt to '${TAG_VERSION}', commit it, delete and re-create the tag on that commit. Shipping them out of sync breaks the in-app update check."
            exit 1
          fi
          echo "OK: release_version.txt matches the tag."

      # The release job pastes the TOP CHANGELOG.md section (without its heading) into the release page
      # as "What's new". If the top is still an "## Unreleased" section, the page shows it under the wrong
      # version, and a second section below it (there were two "Unreleased" sections on the 1.6.43 and
      # 1.6.44 branches) is left out without any sign. Check the heading here, before the long build.
      - name: Verify the top CHANGELOG.md section is this release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TOP="$(grep -m1 '^## ' CHANGELOG.md | tr -d '\r')"
          echo "tag=${GITHUB_REF_NAME} | top CHANGELOG heading: '${TOP}'"
          # "## v1.6.43" alone or followed by text ("## v1.6.43: a smaller download"), but not "## v1.6.430"
          if ! printf '%s\n' "${TOP}" | grep -Eq "^## v${TAG_VERSION//./\\.}([^0-9.]|$)"; then
            echo "::error::The top CHANGELOG.md heading is '${TOP}', but the tag is '${GITHUB_REF_NAME}'. Merge this release's sections into one, headed '## ${GITHUB_REF_NAME}', commit it, delete and re-create the tag on that commit. Otherwise the release page shows the wrong notes."
            exit 1
          fi
          echo "OK: the top CHANGELOG.md section is ${GITHUB_REF_NAME}."

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyinstaller
          pip install --no-cache-dir -r requirements.txt
          # Pin setuptools < 70 as the LAST dependency step. setuptools 70 removed pkg_resources
          # internals (incl. NullProvider) that PyInstaller's pyi_rth_pkgres runtime hook needs, so
          # the FROZEN app crashed at launch with
          #   AttributeError: module 'pkg_resources' has no attribute 'NullProvider'
          # (hit on the macOS installer; the build had no setuptools pin and silently drifted onto a
          # too-new version). Doing it last means the app bundles a pkg_resources that still exposes it.
          # See PyInstaller issue #8554 / setuptools issue #1963.
          pip install --no-cache-dir "setuptools<70"

      - name: Install Windows-only dependencies
        if: runner.os == 'Windows'
        run: pip install --no-cache-dir -r requirements-windows.txt

      - name: Install macOS-only dependencies
        if: runner.os == 'macOS'
        run: pip install --no-cache-dir -r requirements-mac.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller NLP_Suite.spec --noconfirm

      - name: Bundle portable Python environment
        shell: bash
        run: |
          set -euo pipefail
          DIST="dist/NLP_Suite/python-env"
          PBS_TAG="20241002"

          if [ "$RUNNER_OS" = "macOS" ]; then
            ARCH=$(uname -m)
            if [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi
            PBS_URL="https://github.com/indygreg/python-build-standalone/releases/download/${PBS_TAG}/cpython-3.10.15+${PBS_TAG}-${ARCH}-apple-darwin-install_only_stripped.tar.gz"
          else
            PBS_URL="https://github.com/indygreg/python-build-standalone/releases/download/${PBS_TAG}/cpython-3.10.15+${PBS_TAG}-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
          fi

          # SHA256 of each file this step may download, copied from that release's SHA256SUMS. The project
          # moved to astral-sh/python-build-standalone; GitHub redirects the indygreg/ URLs above, and the
          # files are the same. 3.11.10 is listed ahead of the Python 3.11 move (#1688). Changing PBS_TAG
          # or the Python version means adding its line here, from
          # https://github.com/astral-sh/python-build-standalone/releases/download/<PBS_TAG>/SHA256SUMS
          PBS_FILE="$(basename "$PBS_URL")"
          case "$PBS_FILE" in
            cpython-3.10.15+20241002-aarch64-apple-darwin-install_only_stripped.tar.gz)  PBS_SHA=1f753073b2333b2977922387fe016255ebde0f8558c567ffb960b7f50477fd34 ;;
            cpython-3.10.15+20241002-x86_64-pc-windows-msvc-install_only_stripped.tar.gz) PBS_SHA=50a39a5a09dd8786b154b116dbdbf7d6292fdf63b1683f6006d43246c0b9aad9 ;;
            cpython-3.11.10+20241002-aarch64-apple-darwin-install_only_stripped.tar.gz)  PBS_SHA=263b1b50ff705ab064c50c3165de9df2ed712a77cd81c55dd340c3172e103687 ;;
            cpython-3.11.10+20241002-x86_64-pc-windows-msvc-install_only_stripped.tar.gz) PBS_SHA=15a14bdc15a43119d74b7e3bde00031011d49d2a6068fe9743da92ba0c3d7b87 ;;
            *) echo "::error::No SHA256 listed for $PBS_FILE. Add it to this step from the release's SHA256SUMS."; exit 1 ;;
          esac

          echo "Downloading portable Python from $PBS_URL"
          curl -fSL "$PBS_URL" -o /tmp/python-portable.tar.gz
          # sha256sum on the Windows runner (Git Bash), shasum on the Mac runner
          if command -v sha256sum >/dev/null; then GOT=$(sha256sum /tmp/python-portable.tar.gz | cut -d' ' -f1)
          else GOT=$(shasum -a 256 /tmp/python-portable.tar.gz | cut -d' ' -f1); fi
          GOT="${GOT#\\}"   # GNU sha256sum may prefix the line with a backslash
          if [ "$GOT" != "$PBS_SHA" ]; then
            echo "::error::$PBS_FILE has SHA256 $GOT, expected $PBS_SHA. The download is corrupt or was changed; do not ship it."
            exit 1
          fi
          echo "SHA256 OK: $PBS_FILE"
          mkdir -p "$DIST"
          tar -xzf /tmp/python-portable.tar.gz -C "$DIST" --strip-components=1

          if [ "$RUNNER_OS" = "macOS" ]; then
            PYTHON="$DIST/bin/python3"
          else
            PYTHON="$DIST/python.exe"
          fi

          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install --no-cache-dir -r requirements.txt
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$PYTHON" -m pip install --no-cache-dir -r requirements-windows.txt
          else
            "$PYTHON" -m pip install --no-cache-dir -r requirements-mac.txt
          fi
          # spaCy English model — NOT pulled in by `pip install spacy`; the suite loads
          # en_core_web_sm widely (spell-checker, SRL, statistics, topic modeling, WSI, spaCy parser).
          # spacy download installs the model wheel matching the installed spaCy version.
          "$PYTHON" -m spacy download en_core_web_sm
          # Verify (including that the spaCy English model actually loads)
          "$PYTHON" -c "import pandas, requests, numpy, matplotlib, scipy, sklearn, stanza, spacy, nltk, plotly, seaborn, folium, gensim, wordcloud, transformers, sentence_transformers, bertopic, PIL; spacy.load('en_core_web_sm'); print('All critical packages + en_core_web_sm OK')"
          echo "Bundled portable Python environment"

      - name: Bundle Java runtime (JRE) for Stanford CoreNLP tools
        shell: bash
        run: |
          set -euo pipefail
          # The portable app has no system Java; Stanford CoreNLP tools (spell checker, coreference,
          # gender, sentiment, all CoreNLP parsers) need it. Bundle a Temurin JRE at dist/NLP_Suite/jre;
          # IO_libraries_util.get_java_executable() finds <app>/jre/bin/java at runtime.
          JRE_DIR="dist/NLP_Suite/jre"
          # A pinned release with its published SHA256, so every build of a tag ships the same Java. (The
          # Adoptium "latest" URL used before could ship a different JRE on a rebuild, unchecked.)
          # 17.0.21+9 is what v1.6.41 shipped. To update: the release names are listed at
          #   https://api.adoptium.net/v3/info/release_names?release_type=ga&version=%5B17%2C18%29&image_type=jre
          # and each file's name and checksum at
          #   https://api.adoptium.net/v3/assets/release_name/eclipse/<release, + as %2B>?image_type=jre&os=<mac|windows>
          JRE_RELEASE="jdk-17.0.21+9"
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$(uname -m)" != "arm64" ]; then echo "::error::Only the Apple Silicon JRE is listed in this step."; exit 1; fi
            EXT="tar.gz"
            JRE_FILE="OpenJDK17U-jre_aarch64_mac_hotspot_17.0.21_9.tar.gz"
            JRE_SHA="a5ab5bacd6e719d5a5570580ed14dceb2ed532208a39af927906b9742da1745e"
          else
            EXT="zip"
            JRE_FILE="OpenJDK17U-jre_x64_windows_hotspot_17.0.21_9.zip"
            JRE_SHA="fe4656bd78fb09812dc38c49da777f79cc33e7ee435a254be82f9e7f40d9d117"
          fi
          URL="https://github.com/adoptium/temurin17-binaries/releases/download/${JRE_RELEASE/+/%2B}/${JRE_FILE}"
          echo "Downloading Temurin JRE ${JRE_RELEASE}: $URL"
          # Use WORKSPACE-RELATIVE paths, NOT /tmp. On the Windows runner, Git Bash's curl writes to
          # the MSYS /tmp, but native Windows python resolves '/tmp/jre.zip' as C:\tmp\jre.zip -- a
          # different location -- so extraction failed with FileNotFoundError. Relative paths resolve
          # to the same working directory for both the MSYS and native toolchains.
          curl -fSL "$URL" -o "jre_dl.${EXT}"
          if command -v sha256sum >/dev/null; then GOT=$(sha256sum "jre_dl.${EXT}" | cut -d' ' -f1)
          else GOT=$(shasum -a 256 "jre_dl.${EXT}" | cut -d' ' -f1); fi
          GOT="${GOT#\\}"
          if [ "$GOT" != "$JRE_SHA" ]; then
            echo "::error::$JRE_FILE has SHA256 $GOT, expected $JRE_SHA. The download is corrupt or was changed; do not ship it."
            exit 1
          fi
          echo "SHA256 OK: $JRE_FILE"
          rm -rf jre_extract; mkdir -p jre_extract
          if [ "$EXT" = "zip" ]; then
            python -c "import zipfile; zipfile.ZipFile('jre_dl.zip').extractall('jre_extract')"
            JAVA_BIN=$(find jre_extract -type f -name java.exe | head -1)
          else
            tar -xzf "jre_dl.tar.gz" -C jre_extract
            JAVA_BIN=$(find jre_extract -type f -name java | head -1)
          fi
          if [ -z "${JAVA_BIN:-}" ]; then echo "ERROR: java not found in extracted JRE"; exit 1; fi
          HOME_DIR=$(dirname "$(dirname "$JAVA_BIN")")   # .../bin/java -> Home
          rm -rf "$JRE_DIR"; mkdir -p "$JRE_DIR"
          cp -R "$HOME_DIR/." "$JRE_DIR/"
          "$JRE_DIR/bin/$(basename "$JAVA_BIN")" -version
          rm -rf jre_extract "jre_dl.${EXT}"   # keep the workspace clean for the archive step
          echo "Bundled Temurin JRE ${JRE_RELEASE} at $JRE_DIR"

      - name: Bundle VC++ runtime DLLs into portable env (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $envDir = "dist/NLP_Suite/python-env"
          $sklearnLibs = Join-Path $envDir "Lib/site-packages/sklearn/.libs"
          if (-not (Test-Path $sklearnLibs)) {
            New-Item -ItemType Directory -Path $sklearnLibs -Force | Out-Null
            Write-Host "Created $sklearnLibs"
          }
          # Full VC++ runtime DLL set for the python-env root (per Evan's Windows testing)
          $rootDlls = @(
            "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll", "vcamp140.dll", "vccorlib140.dll", "vcomp140.dll",
            "vcruntime140.dll", "vcruntime140_1.dll", "vcruntime140_threads.dll", "concrt140.dll"
          )
          # DLLs that sklearn specifically loads from its own .libs folder
          $sklearnDlls = @("msvcp140.dll", "vcomp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          # System32 ONLY. On 64-bit Windows, SysWOW64 holds the 32-bit DLLs; one copied into this 64-bit
          # env would fail to load on users' machines. A missing DLL or a failed copy stops the build
          # (all 16 were found on the v1.6.41 build), instead of printing a warning nobody reads.
          $ErrorActionPreference = 'Stop'
          $missing = @()
          function Copy-Dll($dll, $dest) {
            $src = Join-Path "C:\Windows\System32" $dll
            if (-not (Test-Path $src)) { $script:missing += $dll; return }
            Copy-Item $src $dest -Force
            Write-Host "Copied $dll -> $dest"
          }
          foreach ($d in $rootDlls)    { Copy-Dll $d $envDir }
          foreach ($d in $sklearnDlls) { Copy-Dll $d $sklearnLibs }
          if ($missing.Count -gt 0) {
            Write-Host "::error::VC++ runtime DLLs not found in C:\Windows\System32: $($missing -join ', ')"
            exit 1
          }

      - name: Copy data directories to dist (all platforms)
        shell: python
        run: |
          import shutil, os, glob
          dist = 'dist/NLP_Suite'
          for d in ['lib', 'config', 'TIPS', 'reminders']:
              if os.path.isdir(d):
                  dst = os.path.join(dist, d)
                  if os.path.exists(dst):
                      shutil.rmtree(dst)
                  shutil.copytree(d, dst)
                  print(f'Copied {d} -> {dst}')
          # The live config/ is private and untracked, so it is never in the checkout. Seed a default
          # config/ for first-time users from the committed, secret-free lib/config_defaults/.
          cfg_defaults = os.path.join('lib', 'config_defaults')
          if os.path.isdir(cfg_defaults):
              cfg_dst = os.path.join(dist, 'config')
              os.makedirs(cfg_dst, exist_ok=True)
              for f in glob.glob(os.path.join(cfg_defaults, '*.csv')):
                  shutil.copy2(f, cfg_dst)
                  print(f'Seeded config default: {os.path.basename(f)}')
          src_dst = os.path.join(dist, 'src')
          os.makedirs(src_dst, exist_ok=True)
          count = 0
          for f in glob.glob('src/*.py'):
              shutil.copy2(f, src_dst)
              count += 1
          print(f'Copied {count} .py files to {src_dst}')

      - name: Copy getting-started guide
        shell: python
        run: |
          import shutil
          shutil.copy2('GETTING_STARTED.txt', 'dist/NLP_Suite/GETTING_STARTED.txt')
          print('Copied GETTING_STARTED.txt')

      - name: Copy platform-specific DLLs (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source
          $dist = "dist/NLP_Suite"
          # Copy any missing DLLs that PyInstaller warns about. A DLL not found, or a failed copy, stops
          # the build (all three were found on the v1.6.41 build).
          $dlls = @("tk86t.dll", "tcl86t.dll", "sqlite3.dll")
          $missing = @()
          foreach ($dll in $dlls) {
            # SilentlyContinue here only skips unreadable folders during the search
            $found = Get-ChildItem $pythonDir -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { $missing += $dll; continue }
            Copy-Item $found.FullName $dist -ErrorAction Stop
            Write-Host "Copied $dll"
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Not found under ${pythonDir}: $($missing -join ', ')"
            exit 1
          }

      # Ad-hoc signature on the frozen launcher. No --deep: it only reaches inside .app bundles, and this
      # is a bare executable. No xattr here either: files on the runner never carry the quarantine flag
      # (macOS adds it when the USER downloads the zip), so the launcher .command below clears it there.
      - name: Sign Mac executable
        if: runner.os == 'macOS'
        run: codesign --force -s - dist/NLP_Suite/NLP_Suite

      - name: Add Mac one-click launcher (clears quarantine + launches)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          L="dist/NLP_Suite/Launch NLP Suite (Mac).command"
          printf '%s\n' \
            '#!/bin/sh' \
            '# Double-click to clear macOS Gatekeeper quarantine on this folder and launch NLP Suite.' \
            '# First run only: right-click this file -> Open to get past the unidentified-developer prompt.' \
            'cd "$(dirname "$0")"' \
            'xattr -dr com.apple.quarantine . 2>/dev/null' \
            'exec ./NLP_Suite' > "$L"
          chmod +x "$L"
          echo "Added Mac one-click launcher: $L"

      # The automatable part of the pre-tag checklist in CLAUDE.md: every entry point is in the folder,
      # and every src/*.py compiles under the BUNDLED Python (catches syntax that the bundled version
      # rejects, e.g. after a Python version change). compile() writes no files, so dist/ is unchanged
      # for the file list below. A person still has to launch the app before tagging.
      - name: Check the build has its entry points and the code compiles
        shell: bash
        run: |
          set -euo pipefail
          D="dist/NLP_Suite"
          if [ "$RUNNER_OS" = "macOS" ]; then
            PY="$D/python-env/bin/python3"
            NEED=("$D/NLP_Suite" "$D/Launch NLP Suite (Mac).command" "$PY" "$D/jre/bin/java")
          else
            PY="$D/python-env/python.exe"
            NEED=("$D/NLP_Suite.exe" "$PY" "$D/jre/bin/java.exe")
          fi
          NEED+=("$D/src/NLP_menu_main.py" "$D/lib/release_version.txt" "$D/GETTING_STARTED.txt" "$D/config")
          MISSING=0
          for f in "${NEED[@]}"; do
            if [ -e "$f" ]; then echo "found: $f"; else echo "::error::missing from the build: $f"; MISSING=1; fi
          done
          [ "$MISSING" = 0 ] || exit 1
          "$PY" -I -c "
          import glob, sys
          files = sorted(glob.glob('$D/src/*.py'))
          bad = []
          for f in files:
              try:
                  compile(open(f, 'rb').read(), f, 'exec')
              except SyntaxError as e:
                  bad.append(f'{f}: {e}')
          print(len(files), 'files compiled,', len(bad), 'errors')
          print(*bad, sep='\n')
          sys.exit(1 if bad or len(files) < 100 else 0)
          "

      # Last step before zipping: the release's own file list (path, size, hash) in lib/. The in-app
      # self-updater compares the installed folder against it to find the user's own files (added
      # anywhere, or release files they edited) and keeps them. Anything added to dist/ after this
      # step would look like a user file, so keep this step right before the Archive steps.
      - name: Write the release file list for the self-updater
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import NLP_setup_self_update_util as u; n = u.write_manifest('dist/NLP_Suite'); print(n, 'files listed'); sys.exit(0 if n > 1000 else 1)"

      # GitHub's upload-artifact strips unix permission bits when uploading a folder, which left the
      # Mac NLP_Suite launcher, python-env/bin/python3, and the Launch .command as non-executable "documents".
      # Zipping on the native runner preserves exec bits and symlinks; the zip is uploaded as an opaque
      # file (its internals are untouched) and attached to the Release as-is.
      - name: Archive build - macOS (zip preserves exec permissions + symlinks)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          chmod +x "NLP_Suite/NLP_Suite" 2>/dev/null || true
          find "NLP_Suite/python-env/bin" -type f -exec chmod +x {} \; 2>/dev/null || true
          chmod +x "NLP_Suite/Launch NLP Suite (Mac).command" 2>/dev/null || true
          zip -r -y -X "../${{ matrix.artifact }}.zip" NLP_Suite
          echo "Created ${{ matrix.artifact }}.zip (permissions preserved)"

      - name: Archive build - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/NLP_Suite" -DestinationPath "${{ matrix.artifact }}.zip" -Force
          Write-Host "Created ${{ matrix.artifact }}.zip"

      # GitHub refuses a release file of 2 GiB or more. Without this check both builds pass and the
      # release job fails at the very end with an upload error that does not name the cause. v1.6.41's
      # zips were 1.61 GB (Windows) and 1.40 GB (Mac). Warn from 1.8 GiB so there is time to act.
      - name: Check the zip fits GitHub's 2 GiB release limit
        shell: bash
        run: |
          ZIP="${{ matrix.artifact }}.zip"
          SIZE=$(wc -c < "$ZIP" | tr -d ' ')
          LIMIT=2147483648      # 2 GiB
          WARN=1932735283       # 1.8 GiB
          echo "$ZIP: $SIZE bytes ($((SIZE / 1048576)) MiB); limit $((LIMIT / 1048576)) MiB"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::$ZIP is $((SIZE / 1048576)) MiB; GitHub does not accept a release file of 2048 MiB or more. Shrink the build (docs/future-work.md section 2) before tagging."
            exit 1
          elif [ "$SIZE" -ge "$WARN" ]; then
            echo "::warning::$ZIP is $((SIZE / 1048576)) MiB, close to GitHub's 2048 MiB release-file limit."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

  # Create a GitHub Release with both builds when triggered by a tag
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      # Checkout MUST run before download-artifact: actions/checkout cleans the workspace,
      # which would delete the downloaded artifacts if it ran afterwards. It also gives the
      # release step access to docs/release_body_header.md and CHANGELOG.md.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      # Assemble the release body: fixed download instructions (docs/release_body_header.md)
      # followed by the newest CHANGELOG.md section as the human-readable "What's new".
      # GitHub's own auto-generated "What's Changed" commit list is appended below by
      # generate_release_notes. Also expose today's date for the release name.
      - name: Build release notes
        id: notes
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          cat docs/release_body_header.md > RELEASE_BODY.md
          echo '' >> RELEASE_BODY.md
          if [ -f CHANGELOG.md ]; then
            # print the bullets of the top (newest) CHANGELOG section, excluding its heading
            awk '/^## /{n++} n==1 && !/^## /{print}' CHANGELOG.md >> RELEASE_BODY.md
          fi

      # Each artifact is already a permission-preserving zip built on its native runner.
      # download-artifact@v4 places each into a directory named after the artifact, so attach
      # those zips directly - do NOT re-zip (re-zipping on Linux would strip the Mac exec bits).
      - name: Create Release
        uses: softprops/action-gh-release@v2   # v1 ran on Node 16, which GitHub no longer supports
        with:
          name: ${{ github.ref_name }} (${{ steps.notes.outputs.date }})
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          files: |
            NLP-Suite-windows-x64/NLP-Suite-windows-x64.zip
            NLP-Suite-mac-arm64/NLP-Suite-mac-arm64.zip
