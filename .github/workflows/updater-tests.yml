name: Updater tests (Windows, Mac)

# Test branch only: runs tests/test_setup_self_update_util.py from fix/updater-swap-start-race on the two
# platforms whose swap scripts CI's Ubuntu job cannot run (PowerShell; the Mac's bash /bin/sh).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/tcl9-gui-upgrades-0fr6u2
    paths:
      - .github/workflows/updater-tests.yml

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/updater-swap-start-race
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pytest requests
      - run: python -m pytest -v -rs tests/test_setup_self_update_util.py
