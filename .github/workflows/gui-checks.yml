name: GUI checks on built zips (Windows, Mac)

# Test branch only. The `check` job of tk9-windows-check.yml on its own, on candidate zips an earlier run
# already built (CAND_RUN), against a published baseline: Tk probes, bundle_gate, the layout gate and the
# screenshot gallery, with every dialog answered at once (.github/tk9-check/no_popups.py).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/tcl9-gui-upgrades-0fr6u2
    paths:
      - .github/workflows/gui-checks.yml
      - .github/tk9-check/**

permissions:
  contents: read
  actions: read

env:
  CAND_RUN: '46120257866'
  BASE: '1.6.47'
  DO_NOT_TRACK: '1'
  NLP_SILENT: '1'
  PYTHONIOENCODING: utf-8

jobs:
  check:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: NLP-Suite-windows-x64, py: python-env/python.exe }
          - { os: macos-15, artifact: NLP-Suite-mac-arm64, py: python-env/bin/python3 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: cand_zip
          run-id: ${{ env.CAND_RUN }}
          github-token: ${{ github.token }}
      - name: Get the published ${{ env.BASE }} zip
        run: curl -fSL -o base.zip "https://github.com/NLP-Suite/NLP-Suite/releases/download/v$BASE/${{ matrix.artifact }}.zip"
      - name: Unzip both
        run: |
          set -euo pipefail
          bash .github/tk9-check/unzip_bundle.sh "cand_zip/${{ matrix.artifact }}.zip" cand
          bash .github/tk9-check/unzip_bundle.sh base.zip base
          for d in base cand; do
            "$d/NLP_Suite/${{ matrix.py }}" -c "import sys, tkinter; print('$d', open('$d/NLP_Suite/lib/release_version.txt').read().strip(), 'Python', sys.version.split()[0], 'Tk', tkinter.Tcl().eval('info patchlevel'))"
          done
          mkdir -p results config
          cp lib/config_defaults/*.csv config/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pyinstaller

      - name: Tk probes (DPI on Windows only)
        continue-on-error: true
        run: |
          for d in base cand; do
            PY="$d/NLP_Suite/${{ matrix.py }}"
            {
              if [ "$RUNNER_OS" = "Windows" ]; then "$PY" .github/tk9-check/dpi_probe.py; echo; fi
              "$PY" .github/tk9-check/tk9_features_probe.py
            } 2>&1 | tee "results/probe-$d.txt"
          done

      - name: bundle_gate snapshot and compare
        continue-on-error: true
        run: |
          set -o pipefail
          for d in base cand; do
            python tests/bundle_gate.py snapshot "$d/NLP_Suite" -o "results/bundle-$d.json" --pyinstaller python 2>&1 | tee "results/bundle-$d.log"
          done
          python tests/bundle_gate.py compare results/bundle-base.json results/bundle-cand.json 2>&1 | tee results/bundle-compare.txt

      - name: Layout gate on both Pythons (same src/), dialogs answered
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set -o pipefail
          rc=0
          for d in base cand; do
            "$d/NLP_Suite/${{ matrix.py }}" .github/tk9-check/layout_gate.py 2>&1 | tee "results/layout-$d.txt" || rc=1
            cp tests/gui_layout_gate.log "results/layout-$d.log" || true
          done
          exit $rc

      - name: Screenshot gallery on both Pythons, dialogs answered
        continue-on-error: true
        timeout-minutes: 60
        run: |
          for d in base cand; do
            GALLERY_OUT="results/gallery-$d" "$d/NLP_Suite/${{ matrix.py }}" .github/tk9-check/gui_gallery.py 2>&1 | tee "results/gallery-$d.txt"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-check-${{ runner.os }}
          path: results
          retention-days: 30
